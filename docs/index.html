<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MusicGroundingBench</title>
<style>
/* layout concept: plain report page -- one neutral grey/ink palette, a single muted blue accent,
   one formal sans typeface throughout, monospace reserved for numeric readouts only */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F3F5; --ink:#1A1D21; --ink-2:#50565F; --ink-3:#7B818A;
  --line:#DDE0E4; --line-2:#EBEDEF; --accent:#2E5281; --accent-soft:rgba(46,82,129,.09);
  --good:#2F7D4F; --bad:#B0392E; --warn:#9A6A14;
  --roll-bg:#F7F8F9; --roll-bk:#ECEEF0; --roll-line:#DADDE1; --note:#AFB5BD; --note-ln:#8D939C; --note-ev:#2E5281; --note-ev-ln:#1E3A5F; --note-ev-ink:#FFFFFF;
  --key-w:#FFFFFF; --key-b:#1F2328;
  --c-rhythm:#0E7490; --c-tonality:#B45309; --c-interval:#4F46E5; --c-bar_comparison:#475569; --c-harmony:#BE185D; --c-repetition:#4D7C0F; --c-harmonic_pattern:#7E22CE;
  --c-ABS:#2563EB; --c-REL:#C2410C; --c-ORD:#15803D; --c-PAT:#C026D3;
  --font:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:"Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#181A1E; --surface-2:#1F2227; --ink:#E7E9EC; --ink-2:#A9AFB8; --ink-3:#787E88;
    --line:#2C2F34; --line-2:#24262B; --accent:#7CA3D1; --accent-soft:rgba(124,163,209,.14);
    --good:#63BB82; --bad:#E0847A; --warn:#D8A94D;
    --roll-bg:#16181B; --roll-bk:#1D2024; --roll-line:#2C2F34; --note:#4B5158; --note-ln:#6B7178; --note-ev:#7CA3D1; --note-ev-ln:#AECAEA; --note-ev-ink:#10141A;
    --key-w:#C7CBD1; --key-b:#0B0D0F;
    --c-rhythm:#4CC3DA; --c-tonality:#F0B15A; --c-interval:#9AA1FF; --c-bar_comparison:#9DB0C4; --c-harmony:#FF86B8; --c-repetition:#A6D65A; --c-harmonic_pattern:#C79BFF;
    --c-ABS:#7AA2FF; --c-REL:#F29A6B; --c-ORD:#6FD08C; --c-PAT:#E58CF5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#181A1E; --surface-2:#1F2227; --ink:#E7E9EC; --ink-2:#A9AFB8; --ink-3:#787E88;
  --line:#2C2F34; --line-2:#24262B; --accent:#7CA3D1; --accent-soft:rgba(124,163,209,.14);
  --good:#63BB82; --bad:#E0847A; --warn:#D8A94D;
  --roll-bg:#16181B; --roll-bk:#1D2024; --roll-line:#2C2F34; --note:#4B5158; --note-ln:#6B7178; --note-ev:#7CA3D1; --note-ev-ln:#AECAEA; --note-ev-ink:#10141A;
  --key-w:#C7CBD1; --key-b:#0B0D0F;
  --c-rhythm:#4CC3DA; --c-tonality:#F0B15A; --c-interval:#9AA1FF; --c-bar_comparison:#9DB0C4; --c-harmony:#FF86B8; --c-repetition:#A6D65A; --c-harmonic_pattern:#C79BFF;
  --c-ABS:#7AA2FF; --c-REL:#F29A6B; --c-ORD:#6FD08C; --c-PAT:#E58CF5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.6rem;line-height:1.2}
p{margin:0}
.mono{font-family:var(--mono)}
.eyebrow{font:500 .72rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:.8rem;color:var(--ink-3)}

.top{padding-block:18px 4px}
.top h1{font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:1.2;margin:0 0 4px}
.top .lead{font-size:.9rem;color:var(--ink-2)}

section{padding-block:10px 18px;border-top:1px solid var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card .qtext{font-size:1.06rem;font-weight:500;letter-spacing:-.008em;line-height:1.28;margin:6px 0 5px}

.tabs{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:.86rem}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:.83rem;font-weight:500;color:var(--ink-2)}
.pill i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--dc,var(--ink-3))}
.pill:hover{background:var(--surface-2)}
.pill[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill[aria-selected="true"] i{background:var(--bg)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 .72rem/1 var(--mono);padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.chip i{font-style:normal;opacity:.6}
.chip.d{background:color-mix(in srgb,var(--dc) 15%,transparent);color:var(--dc)}
.chip.d em{font-style:normal;font-weight:400;opacity:.85}
.chip.d::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dc);flex:none}

.player{display:flex;align-items:center;gap:12px;margin:8px 0 3px;padding:8px 12px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.play:hover{filter:brightness(1.08)}
.play svg{width:18px;height:18px;fill:currentColor}
.pbody{flex:1;min-width:0;display:grid;gap:5px}
.pt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pt b{font-size:1rem;font-weight:600}
.pt span{font:500 .82rem var(--mono);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pbody input[type=range]{width:100%;margin:0;accent-color:var(--accent);cursor:pointer;height:20px}
.phint{font-size:.76rem;color:var(--ink-3)}

/* timeline + piano roll */
.tl{position:relative;display:grid;grid-template-columns:var(--labw) minmax(0,1fr);margin-top:6px;--labw:18.5rem}
.tl .grp{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;padding-bottom:2px;font:500 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tl .grp::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.tl .grp.sup{color:var(--accent)}
.answers .grp{display:flex;align-items:center;gap:10px;margin-top:5px;font:500 .68rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.answers .grp::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.answers .grp.sup{color:var(--accent)}
.answers{display:grid;gap:5px;margin-top:8px}
.ans{display:grid;grid-template-columns:20rem minmax(0,1fr);gap:12px;align-items:start;padding:6px 9px;border:1px solid var(--line-2);border-radius:8px}
.ans.ref{background:var(--surface-2);border-color:transparent}
.ans .who{font-size:.82rem;font-weight:500;display:flex;gap:8px;align-items:center;min-width:0}
.ans .who i{width:9px;height:9px;border-radius:3px;flex:none}
.ans .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ans .who .chip{flex:none}
.info{text-decoration:underline dotted var(--ink-3) 1px;text-underline-offset:3px;cursor:help}
.ans .txt{font-size:.9rem;overflow-wrap:anywhere}
.tl .lab{display:flex;align-items:center;gap:7px;padding-right:10px;font-size:.78rem;min-height:22px;min-width:0}
.tl .lab i{width:8px;height:8px;border-radius:3px;flex:none}
.tl .lab b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tl .lab .chip{flex:none}
.tl .trk{position:relative;min-height:22px;border-bottom:1px solid var(--line-2)}
.kbd{position:relative;padding:0!important;display:block!important}
.kbd .k{position:absolute;right:0;display:flex;align-items:center;justify-content:flex-end;gap:6px;width:100%}
.kbd .k em{font:400 .62rem/1 var(--mono);color:var(--ink-3);font-style:normal}
.kbd .k.on em{color:var(--ink);font-weight:500}
.kbd .k s{display:block;height:calc(100% - 1px);width:22px;background:var(--key-w);border:1px solid var(--roll-line);border-radius:0 2px 2px 0;text-decoration:none}
.kbd .k.bk s{width:14px;background:var(--key-b);border-color:var(--key-b);height:70%}
.roll{border-radius:6px;overflow:hidden;background:var(--roll-bg);border:0!important;outline:1px solid var(--roll-line);outline-offset:-1px}
.roll .r{position:absolute;left:0;right:0;border-bottom:1px solid var(--roll-line)}
.roll::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px var(--roll-line);pointer-events:none}
.roll .r.bk{background:var(--roll-bk)}
.roll .r.c{border-bottom-color:var(--note-ln)}
.roll .vl{position:absolute;top:0;bottom:0;border-left:1px solid var(--roll-line)}
.roll .band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.roll .n{position:absolute;background:var(--note);border:1px solid var(--note-ln);border-radius:4px;overflow:hidden;display:flex;align-items:center;padding-left:4px;font:500 .6rem/1 var(--mono);color:var(--ink)}
.roll .n.ev{background:var(--note-ev);border-color:var(--note-ev-ln);color:var(--note-ev-ink)}
.sp{position:absolute;top:7px;bottom:7px;border-radius:5px;min-width:3px}
.sp.gt{background:var(--ink)}
.trk .empty{position:absolute;inset:0;display:flex;align-items:center;padding-left:6px;font:italic 400 .76rem var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.axis{position:relative;height:18px}
.axis span{position:absolute;top:3px;transform:translateX(-50%);font:400 .68rem var(--mono);color:var(--ink-3)}
.axis span::before{content:"";position:absolute;left:50%;top:-5px;height:4px;border-left:1px solid var(--line)}
.ovl{position:absolute;top:0;bottom:18px;left:var(--labw);right:0;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);left:0;display:none;z-index:3}
.tl.seekable .roll{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.76rem;color:var(--ink-3)}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

.note{font-size:.82rem;color:var(--ink-3);margin-top:8px;max-width:52rem}

@media (max-width:900px){
  .nav{display:none}
}
@media (max-width:560px){
  .tl{--labw:7.6rem}
  .tl .lab{font-size:.72rem;padding-right:6px}
  .ans{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<body>

<main>
<div class="wrap top">
  <h1>Note-Level Temporal Grounding of Musical Concepts in Large Audio-Language Models</h1>
  <p class="lead">Every reported model's actual prediction, one item per concept &mdash; matches Table 1 (grounding) and Table 2 (understanding) of the paper.</p>
</div>

<section id="explore"><div class="wrap">
  <div class="tabs" role="tablist" id="taskTabs" aria-label="Task">
    <button class="tab" role="tab" data-task="g3">MGBench-3N &middot; Grounding</button>
    <button class="tab" role="tab" data-task="g2">MGBench-2B &middot; Grounding</button>
    <button class="tab" role="tab" data-task="u2">MGBench-2B &middot; Understanding</button>
  </div>
  <div class="picker" role="tablist" id="picker" aria-label="Concept"></div>
  <div class="card" id="detail"></div>
</div></section>
</main>

<script src="data.js"></script>
<script>
(function(){
"use strict";
var D = window.MGB;
var $ = function(s, r){ return (r||document).querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var pretty = function(s){ return String(s).replace(/_/g," "); };
var f2 = function(x){ return (Math.round(x*100)/100).toFixed(2); };
var fmt = function(n){ return n.toLocaleString("en-US"); };

/* categories: 3N -> ABS / REL / ORD / PAT; 2B -> 7 music concepts */
var CAT = {
  ABS:{label:"Absolute", v:"--c-ABS"}, REL:{label:"Relative", v:"--c-REL"}, ORD:{label:"Ordinal", v:"--c-ORD"}, PAT:{label:"Pattern", v:"--c-PAT"},
  rhythm:{label:"Rhythm", v:"--c-rhythm"}, tonality:{label:"Tonality", v:"--c-tonality"}, interval:{label:"Interval", v:"--c-interval"},
  bar_comparison:{label:"Bar comparison", v:"--c-bar_comparison"}, harmony:{label:"Harmony", v:"--c-harmony"},
  repetition:{label:"Repetition", v:"--c-repetition"}, harmonic_pattern:{label:"Harmonic pattern", v:"--c-harmonic_pattern"}
};
var CONCEPT_ORDER = ["rhythm","tonality","interval","bar_comparison","harmony","repetition","harmonic_pattern"];
var G3_CAT_ORDER = ["ABS","REL","ORD","PAT"];
function conceptOf(task, x){ var k = task==="g3" ? x.kind.split("/")[0] : x.concept; return {dom:k, label:CAT[k]?CAT[k].label:pretty(k)}; }
function domChip(dom, extra){ return '<span class="chip d" style="--dc:var('+CAT[dom].v+')">'+esc(CAT[dom].label)+(extra!==undefined?' <i>'+extra+'</i>':'')+'</span>'; }

/* ---------- model registry (dynamic, from data.js) ---------- */
/* dataviz-blessed 8-hue categorical order, cycled per task's own model_order */
var PALETTE = [
  ["#2a78d6","#3987e5"], ["#eb6834","#d95926"], ["#1baf7a","#199e70"], ["#eda100","#c98500"],
  ["#e87ba4","#d55181"], ["#008300","#008300"], ["#4a3aa7","#9085e9"], ["#e34948","#e66767"]
];
var GRP_LABEL = {
  sup:"Supervised (ours)", zs:"Zero-shot · no MGBench training", nonllm:"Non-LLM baseline (closed vocabulary)",
  oracle:"GT-Note oracle · no audio, no training", ctrl:"Audio-dependence / symbolic controls"
};
var GRP_ORDER = ["oracle","nonllm","zs","sup","ctrl"];
function isDark(){ var t=document.documentElement.getAttribute("data-theme"); if(t) return t==="dark"; return matchMedia("(prefers-color-scheme: dark)").matches; }
function modelColor(task, key){ var i = D.model_order[task].indexOf(key); var pair = PALETTE[i % PALETTE.length]; return isDark()?pair[1]:pair[0]; }
function modelName(key){ return (D.model_meta[key] && D.model_meta[key].name) || pretty(key); }
function modelGroup(key){ return (D.model_meta[key] && D.model_meta[key].group) || "sup"; }
function modelDesc(key){ return (D.model_meta[key] && D.model_meta[key].desc) || ""; }

/* ---------- interval maths (for grounding IoU scoring) ---------- */
function mergeIv(a){ var s=a.slice().sort(function(x,y){return x[0]-y[0];}), out=[]; s.forEach(function(iv){ var l=out[out.length-1]; if(l && iv[0]<=l[1]) l[1]=Math.max(l[1],iv[1]); else out.push([iv[0],iv[1]]); }); return out; }
function ivLen(a){ return a.reduce(function(t,iv){return t+iv[1]-iv[0];},0); }
function ivInter(a,b){ var t=0,i=0,j=0; while(i<a.length&&j<b.length){ var lo=Math.max(a[i][0],b[j][0]), hi=Math.min(a[i][1],b[j][1]); if(hi>lo) t+=hi-lo; if(a[i][1]<b[j][1]) i++; else j++; } return t; }
function mIoU(pred, gt){ var P=mergeIv(pred), G=mergeIv(gt), I=ivInter(P,G), U=ivLen(P)+ivLen(G)-I; return U>0? I/U : null; }
function scoreOf(spans, gt){
  if(!gt.length) return spans.length? {t:"false alarm", k:"bad"} : {t:"abstains ✓", k:"good"};
  if(!spans.length) return null;
  var v = mIoU(spans, gt); return {t:"IoU "+f2(v), k: v>=0.7?"good":(v>=0.3?"warn":"bad")};
}
/* simple text-match heuristic for understanding answers -- NOT the paper's LLM judge (which only
   exists for one checkpoint); returns true/false/null (null = reference too ambiguous to check) */
function u2judge(ref, pred, gtype){
  if(!pred) return null;
  var r = String(ref||"").trim().replace(/\.$/,"");
  if(!r) return null;
  if(gtype === "integer" || /^-?\d+$/.test(r)){
    if(/\d\s*seconds?\b/i.test(pred)) return false;
    var refN = parseInt(r, 10);
    var nums = (String(pred).match(/-?\d+\.?\d*/g) || []).map(Number);
    return nums.indexOf(refN) !== -1;
  }
  var rl = r.toLowerCase().replace(/[.,]/g,"").trim();
  if(!rl) return null;
  return String(pred).toLowerCase().replace(/[.,]/g,"").indexOf(rl) !== -1;
}

/* ---------- piano roll ---------- */
var NN = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], BLACK = {1:1,3:1,6:1,8:1,10:1};
function midiName(p){ return NN[p%12]+(Math.floor(p/12)-1); }
function niceStep(end){ return end<=3?0.5:(end<=8?1:2); }
function axisEnd(item, spans){
  var e=0; item.notes.forEach(function(n){ e=Math.max(e,n[1]); });
  (spans||[]).forEach(function(s){ s.forEach(function(iv){ e=Math.max(e,iv[1]); }); });
  return Math.max(2, Math.ceil((e+0.15)*2)/2);
}
function axisHTML(end){
  var step = niceStep(end), out="";
  for(var t=0;t<=end+1e-6;t+=step) out += '<span style="left:'+(t/end*100)+'%">'+(step<1? t.toFixed(1): t)+'s</span>';
  return out;
}
function rollParts(item, end, ref){
  var minp=1e9, maxp=-1, has={};
  item.notes.forEach(function(n){ minp=Math.min(minp,n[2]); maxp=Math.max(maxp,n[2]); has[n[2]]=1; });
  minp-=1; maxp+=1;
  while(maxp-minp+1<13){ if((maxp-minp)%2) maxp++; else minp--; }
  var rows = maxp-minp+1, RH = Math.max(11, Math.min(17, Math.floor(210/rows))), H = rows*RH;
  var step = niceStep(end), roll = "", kbd = "";
  for(var p=maxp, i=0; p>=minp; p--, i++){
    var bk = BLACK[p%12], c = p%12===0, top = i*RH;
    roll += '<div class="r'+(bk?' bk':'')+(c?' c':'')+'" style="top:'+top+'px;height:'+RH+'px"></div>';
    kbd += '<div class="k'+(bk?' bk':'')+(has[p]?' on':'')+'" style="top:'+top+'px;height:'+RH+'px"><em>'+midiName(p)+'</em><s></s></div>';
  }
  for(var t=step; t<end-1e-6; t+=step) roll += '<div class="vl" style="left:'+(t/end*100)+'%"></div>';
  (ref||[]).forEach(function(s){ roll += '<div class="band" style="left:'+(s[0]/end*100)+'%;width:'+Math.max(0.4,(s[1]-s[0])/end*100)+'%"></div>'; });
  item.notes.forEach(function(n){
    var ev = (ref||[]).some(function(s){ return n[0]>=s[0]-0.07 && n[1]<=s[1]+0.07; });
    var w = (n[1]-n[0])/end*100;
    var tip = midiName(n[2])+' (MIDI '+n[2]+') &middot; velocity '+n[3]+' &middot; '+f2(n[0])+'&ndash;'+f2(n[1])+' s';
    roll += '<div class="n'+(ev?' ev':'')+'" style="left:'+(n[0]/end*100)+'%;width:'+Math.max(0.35,w)+'%;top:'+((maxp-n[2])*RH+1)+'px;height:'+(RH-2)+'px" title="'+tip+'">'+(w>7?midiName(n[2]):'')+'</div>';
  });
  return {kbd:kbd, roll:roll, h:H};
}
function spansHTML(spans, end, cls, color){
  return spans.map(function(s){ return '<div class="sp '+(cls||"")+'" style="left:'+(s[0]/end*100)+'%;width:'+Math.max(0.4,(s[1]-s[0])/end*100)+'%;'+(color?'background:'+color+';':'')+'" title="'+f2(s[0])+'&ndash;'+f2(s[1])+' s"></div>'; }).join("");
}
function chipRow(items){ return items.map(function(c){ return c.html || '<span class="chip '+(c.k||"")+'">'+esc(c.t)+'</span>'; }).join(""); }

function buildTimeline(container, item, task, only, compact){
  var order = task ? (only || D.model_order[task]) : [];
  var preds = order.map(function(k){ return {k:k, rec:item.p[k]}; }).filter(function(p){ return p.rec; });
  var end = axisEnd(item, [item.gt].concat(preds.map(function(p){return p.rec.spans||[];})));
  var rp = rollParts(item, end, item.gt);
  var html = '<div class="tl seekable">';
  html += '<div class="lab kbd" style="height:'+rp.h+'px" aria-hidden="true">'+rp.kbd+'</div><div class="trk roll" data-roll style="height:'+rp.h+'px">'+rp.roll+'</div>';
  html += '<div class="lab"><i style="background:var(--ink)"></i><b>Reference</b></div><div class="trk">'+(item.gt.length? spansHTML(item.gt,end,"gt"):'<div class="empty">no valid target &mdash; the answer is &ldquo;No time span.&rdquo;</div>')+'</div>';
  var lastG = null;
  preds.forEach(function(p){
    var grp = modelGroup(p.k), color = modelColor(task, p.k), sc = scoreOf(p.rec.spans, item.gt);
    if(grp !== lastG){ html += '<div class="grp'+(grp==="sup"?" sup":"")+'">'+GRP_LABEL[grp]+'</div>'; lastG = grp; }
    var tip = compact ? esc(modelName(p.k)) : esc(modelName(p.k)+" — "+modelDesc(p.k));
    html += '<div class="lab"><i style="background:'+color+'"></i><b class="'+(compact?"":"info")+'" title="'+tip+'">'+esc(modelName(p.k))+'</b>'+(sc? '<span class="chip '+sc.k+'">'+esc(sc.t)+'</span>':'')+'</div>';
    html += '<div class="trk">'+((p.rec.spans||[]).length? spansHTML(p.rec.spans,end,"",color) : '<div class="empty">'+esc(p.rec.text||"(empty)")+'</div>')+'</div>';
  });
  html += '<div class="lab"></div><div class="axis">'+axisHTML(end)+'</div>';
  html += '<div class="ovl"><div class="ph" data-ph></div></div></div>';
  container.innerHTML = html;
  return end;
}

/* ---------- audio ---------- */
var rafId = null, curAudio = null;
var ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
function attachAudio(host, src, end){
  var a = new Audio(); a.preload = "metadata"; a.src = src; curAudio = a;
  host.innerHTML = '<div class="player"><button type="button" class="play" aria-label="Play the clip">'+ICON_PLAY+'</button>'
    + '<div class="pbody"><div class="pt"><b>Listen to this clip</b><span data-time>0.00 / – s</span></div>'
    + '<input type="range" min="0" max="1000" value="0" step="1" aria-label="Playback position" data-seek>'
    + '<div class="phint">Click the piano roll to jump to that moment.</div></div></div>';
  var btn = host.querySelector(".play"), seek = host.querySelector("[data-seek]"), tm = host.querySelector("[data-time]");
  var root = host.parentNode, ph = root.querySelector("[data-ph]"), roll = root.querySelector("[data-roll]");
  var dragging = false;
  function dur(){ return isFinite(a.duration) && a.duration>0 ? a.duration : end; }
  function paint(){
    var t = a.currentTime, d = dur();
    tm.textContent = t.toFixed(2)+" / "+d.toFixed(2)+" s";
    if(!dragging) seek.value = Math.round(t/d*1000);
    if(ph){ ph.style.left = Math.min(100, t/end*100)+"%"; }
  }
  function loop(){ if(curAudio!==a) return; paint(); if(!a.paused) rafId = requestAnimationFrame(loop); }
  a.addEventListener("loadedmetadata", paint);
  a.addEventListener("play", function(){ btn.innerHTML = ICON_PAUSE; btn.setAttribute("aria-label","Pause the clip"); if(ph) ph.style.display="block"; cancelAnimationFrame(rafId); loop(); });
  a.addEventListener("pause", function(){ btn.innerHTML = ICON_PLAY; btn.setAttribute("aria-label","Play the clip"); cancelAnimationFrame(rafId); paint(); });
  a.addEventListener("ended", function(){ btn.innerHTML = ICON_PLAY; cancelAnimationFrame(rafId); paint(); });
  a.addEventListener("error", function(){ host.innerHTML = '<span class="tiny">Audio unavailable for this item.</span>'; });
  btn.addEventListener("click", function(){ if(a.paused){ if(a.ended) a.currentTime = 0; a.play(); } else a.pause(); });
  seek.addEventListener("input", function(){ dragging = true; a.currentTime = seek.value/1000*dur(); paint(); });
  seek.addEventListener("change", function(){ dragging = false; });
  if(roll) roll.addEventListener("click", function(ev){ var r = roll.getBoundingClientRect(); a.currentTime = Math.max(0,(ev.clientX-r.left)/r.width*end); if(ph) ph.style.display="block"; paint(); a.play(); });
}

/* ---------- tabs + concept picker + single detail panel ---------- */
var S = {task:"g3", sel:null};
function items(){ return D[S.task]; }
function renderPicker(){
  $("#picker").innerHTML = items().map(function(x){
    var c = conceptOf(S.task, x);
    return '<button class="pill" role="tab" data-id="'+x.id+'" aria-selected="'+(!!S.sel && S.sel.id===x.id)+'" style="--dc:var('+CAT[c.dom].v+')"><i></i>'+esc(c.label)+'</button>';
  }).join("");
}
function renderDetail(){
  var x = S.sel; if(!x) return;
  cancelAnimationFrame(rafId); if(curAudio){ curAudio.pause(); } curAudio = null;
  var box = $("#detail"), c = conceptOf(S.task, x);
  if(S.task==="u2"){ renderUnderstanding(x, box, c); return; }
  box.innerHTML =
      '<div class="chips">'+chipRow([{html:domChip(c.dom)}])+'</div><div class="qtext">'+esc(x.q)+'</div>'
    + '<div class="audio" id="audioHost"></div><div id="tlHost"></div>'
    + '<div class="legend"><span><i style="background:var(--note-ev)"></i>evidence note</span><span><i style="background:var(--note)"></i>other note</span><span><i style="background:var(--ink)"></i>reference span</span></div>';
  var end = buildTimeline($("#tlHost"), x, S.task);
  attachAudio($("#audioHost"), "audio/"+(S.task==="g3"?"3N":"2B")+"/"+x.id+".mp3", end);
}
function renderUnderstanding(x, box, c){
  var end = axisEnd(x, [x.ev]);
  var rp = rollParts(x, end, x.ev);
  var order = D.model_order.u2, lastG = null;
  var ans = order.filter(function(k){ return x.p[k]; }).map(function(k){
    var grp = modelGroup(k), color = modelColor("u2", k), gh = "";
    if(grp !== lastG){ gh = '<div class="grp'+(grp==="sup"?" sup":"")+'">'+GRP_LABEL[grp]+'</div>'; lastG = grp; }
    var txt = x.p[k].text, tip = esc(modelName(k)+" — "+modelDesc(k));
    var verdict = u2judge(x.ref, txt, x.gtype);
    var vchip = verdict===null ? "" : (verdict
      ? '<span class="chip good" title="text match vs. the reference &mdash; not the paper’s LLM judge">correct</span>'
      : '<span class="chip bad" title="text match vs. the reference &mdash; not the paper’s LLM judge">wrong</span>');
    return gh+'<div class="ans"><div class="who"><i style="background:'+color+'"></i><b class="info" title="'+tip+'">'+esc(modelName(k))+'</b>'+vchip+'</div><div class="txt">'+(txt? esc(txt) : '<span class="tiny">(empty)</span>')+'</div></div>';
  }).join("");
  box.innerHTML =
      '<div class="chips">'+chipRow([{html:domChip(c.dom)}])+'</div><div class="qtext">'+esc(x.q)+'</div>'
    + '<div class="audio" id="audioHost"></div>'
    + '<div class="tl seekable"><div class="lab kbd" style="height:'+rp.h+'px" aria-hidden="true">'+rp.kbd+'</div><div class="trk roll" data-roll style="height:'+rp.h+'px">'+rp.roll+'</div><div class="lab"></div><div class="axis">'+axisHTML(end)+'</div><div class="ovl"><div class="ph" data-ph></div></div></div>'
    + '<div class="legend"><span><i style="background:var(--note-ev)"></i>evidence note</span><span><i style="background:var(--note)"></i>other note</span></div>'
    + '<div class="answers"><div class="ans ref"><div class="who">Reference</div><div class="txt">'+esc(x.ref)+'</div></div>'+ans+'</div>';
  attachAudio($("#audioHost"), "audio/2B/"+x.id+".mp3", end);
}
function selectId(id){ var x = items().filter(function(i){return i.id===id;})[0]; if(x){ S.sel=x; renderDetail(); renderPicker(); } }
function setTask(t){
  S.task=t;
  document.querySelectorAll("#taskTabs .tab").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.task===t); });
  S.sel = items()[0]; renderPicker(); renderDetail();
}
$("#taskTabs").addEventListener("click", function(e){ var b=e.target.closest(".tab"); if(b) setTask(b.dataset.task); });
$("#picker").addEventListener("click", function(e){ var b=e.target.closest(".pill"); if(b) selectId(b.dataset.id); });

/* ---------- boot ---------- */
setTask("g3");
})();
</script>
