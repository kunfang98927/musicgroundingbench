<title>MGBench Listening Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#141C26; --muted:#5A6676; --line:#D9DFE7; --soft:#EAEEF3;
  --accent:#0F6E7A; --accent-ink:#FFFFFF; --ok:#1E8449; --bad:#C0392B; --unsure:#B9770E;
  --ok-bg:#E4F3EA; --bad-bg:#F9E5E2; --unsure-bg:#FBF0DC; --band:rgba(15,110,122,.20); --band-line:#0F6E7A; --note:#7D8AA0; --note-hi:#0F6E7A; --note-text:#FFFFFF;
  --roll-white:#FFFFFF; --roll-black:#E8ECF1; --row-line:#E1E6ED; --oct-line:#B8C1CE; --key-white:#FFFFFF; --key-black:#3A4453; --key-ink:#141C26;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --panel:#18202A; --ink:#E7ECF2; --muted:#93A0B2; --line:#2A3441; --soft:#212B37;
  --accent:#4FB3BF; --accent-ink:#08191C; --ok:#5CC28A; --bad:#EE7B6E; --unsure:#E3B15A;
  --ok-bg:#16301F; --bad-bg:#3A1F1C; --unsure-bg:#37290F; --band:rgba(79,179,191,.25); --band-line:#4FB3BF; --note:#6D7B90; --note-hi:#4FB3BF; --note-text:#08191C;
  --roll-white:#18202A; --roll-black:#111820; --row-line:#26303C; --oct-line:#43505F; --key-white:#D7DEE7; --key-black:#161C24; --key-ink:#10161D;}}
:root[data-theme="dark"]{
  --bg:#10151C; --panel:#18202A; --ink:#E7ECF2; --muted:#93A0B2; --line:#2A3441; --soft:#212B37;
  --accent:#4FB3BF; --accent-ink:#08191C; --ok:#5CC28A; --bad:#EE7B6E; --unsure:#E3B15A;
  --ok-bg:#16301F; --bad-bg:#3A1F1C; --unsure-bg:#37290F; --band:rgba(79,179,191,.25); --band-line:#4FB3BF; --note:#6D7B90; --note-hi:#4FB3BF; --note-text:#08191C;
  --roll-white:#18202A; --roll-black:#111820; --row-line:#26303C; --oct-line:#43505F; --key-white:#D7DEE7; --key-black:#161C24; --key-ink:#10161D;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
body{padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header.top h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.01em}
.prog{flex:1 1 200px;min-width:160px}
.prog .bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);width:0}
.prog small{color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px}
.tabs button,.seg button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{margin-top:10px;padding:8px 12px;border:1px solid var(--unsure);background:var(--unsure-bg);border-radius:6px;font-size:13px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.chips button{font-family:var(--mono);font-size:11px;padding:5px 0;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;cursor:pointer}
.chips button.cur{outline:2px solid var(--accent);color:var(--ink)}
.chips button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chips button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chips button.unsure{background:var(--unsure-bg);border-color:var(--unsure);color:var(--unsure)}
.chips button.uncl{box-shadow:inset 0 -3px 0 var(--unsure)}
.chips button.hide{display:none}
aside{min-width:0}
@media (min-width:821px){aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 88px);overflow-y:auto;padding-right:4px}}
.fbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;margin-bottom:12px}
.fbox summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600;font-size:13px;padding:4px 0}
.fbox summary b{font-weight:500;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbox label.f{display:block;margin-top:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fbox select{width:100%;margin-top:3px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}
.fbox .frow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.fbox button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.fbox label.chk{font-size:13px;margin-top:8px}
.fmsg{font-size:12px;color:var(--muted);min-height:1.2em;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:36px 8px}
.empty button{font:inherit;margin-top:10px;padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-family:var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 7px;background:var(--soft);color:var(--ink)}
.q{font-size:19px;line-height:1.4;margin:12px 0 14px;font-weight:500;text-wrap:balance}
audio{width:100%;height:44px;margin:2px 0 8px}
.tlwrap{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:120px;cursor:pointer}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px var(--mono);padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:3}
.legend{font-size:12px;color:var(--muted);margin:6px 0 0}
.tlfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:6px 0 0;flex-wrap:wrap}
.ans{margin:18px 0 6px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 6px 6px 0}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ans .txt{font-size:17px;margin-top:2px}
.spans{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.spans button{font-family:var(--mono);font-size:12px;border:1px solid var(--band-line);background:var(--band);color:var(--ink);border-radius:5px;padding:4px 9px;cursor:pointer}
.verdicts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
@media (max-width:520px){.verdicts{grid-template-columns:1fr}}
.verdicts button{font:inherit;font-weight:500;padding:11px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:1px;align-items:center}
.verdicts button kbd{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.verdicts button[data-v="ok"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.verdicts button[data-v="bad"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.verdicts button[data-v="unsure"][aria-pressed="true"]{background:var(--unsure-bg);border-color:var(--unsure);color:var(--unsure)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical;min-height:40px;margin-top:10px}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.nav button{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.help{color:var(--muted);font-size:13px;margin:4px 0 14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.flag{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.flag button{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:2px 7px;cursor:pointer}
[hidden]{display:none!important}
</style>
<div class="wrap">
  <header class="top">
    <h1>Listening check</h1>
    <div class="tabs" role="tablist"><button role="tab" id="tab-rate" aria-selected="true">Rate</button><button role="tab" id="tab-sum" aria-selected="false">Summary</button></div>
    <div class="prog"><div class="bar"><i id="pbar"></i></div><small id="ptxt"></small></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <section id="view-rate">
    <div class="layout">
      <aside>
        <details class="fbox" id="fbox" open>
          <summary><span>Filter</span><b id="fcount"></b></summary>
          <label class="f" for="f-set">Dataset</label><select id="f-set"></select>
          <label class="f" for="f-kind">Task</label><select id="f-kind"></select>
          <label class="f" for="f-concept">Concept</label><select id="f-concept"></select>
          <label class="f" for="f-family">Question family (rated / total)</label><select id="f-family"></select>
          <label class="f" for="f-status">Status</label><select id="f-status"></select>
          <label class="chk"><input type="checkbox" id="adv"> Go to the next item after a verdict</label>
          <div class="frow"><button id="f-reset" type="button">Show all items</button></div>
          <div class="fmsg" id="fmsg" aria-live="polite"></div>
        </details>
        <div class="help">Pick an item, or use ← → to move inside the filtered list. Colours show your own verdicts.</div><div class="chips" id="chips"></div>
      </aside>
      <main class="card" id="card"></main>
    </div>
  </section>
  <section id="view-sum" hidden></section>
</div>
<script>
const ITEMS = /*__ITEMS__*/[];
const $ = (s, el = document) => el.querySelector(s);
try { if (localStorage.getItem('lc_roll') === '0') window.__rollOff = true; } catch (e) {}
let db = null, uid = null, cur = 0, tab = 'rate', showNotes = !window.__rollOff, mine = {}, all = [], stopAt = null, raf = 0;
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const VERD = {ok: 'Correct', bad: 'Wrong', unsure: "Can't tell"};
const fmt = t => t.toFixed(2);

function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
// ---------------------------------------------------------------- filter: dataset / task / concept / family / status
const FKEY = 'lc_filter', FACETS = ['set', 'kind', 'concept', 'family'];
const F = {set: 'all', kind: 'all', concept: 'all', family: 'all', status: 'all'};
let advance = false, lastPos = 0, emptyView = false, firstSync = true;
try { Object.assign(F, JSON.parse(localStorage.getItem(FKEY) || '{}')); advance = localStorage.getItem('lc_adv') === '1'; } catch (e) {}
const STATUS = [['all', 'Any status'], ['todo', 'Not rated yet'], ['ok', 'Rated correct'], ['bad', 'Marked wrong'], ['unsure', "Can't tell"], ['unclear', 'Marked unclear']];
const ANY = {set: 'All datasets', kind: 'All tasks', concept: 'All concepts', family: 'All families'};
const KIND_LABEL = {grounding: 'Grounding (time spans)', understanding: 'Understanding (answer)'};
function facetPass(it, skip){ return FACETS.every(k => k === skip || F[k] === 'all' || it[k] === F[k]); }
function statusPass(it){
  const s = F.status, r = mine[it.id] || {};
  return s === 'all' || (s === 'todo' ? !r.verdict : s === 'unclear' ? !!r.unclear : r.verdict === s);
}
function view(){
  const idx = []; ITEMS.forEach((it, i) => { if (facetPass(it) && statusPass(it)) idx.push(i); });
  if (FACETS.some(k => F[k] !== 'all')) {          // a class of questions was chosen: keep it together, ordered by family and item id
    const key = it => [it.set, it.concept, it.family, it.id];
    idx.sort((a, b) => { const p = key(ITEMS[a]), q = key(ITEMS[b]); for (let j = 0; j < 4; j++) if (p[j] !== q[j]) return p[j] < q[j] ? -1 : 1; return 0; });
  }
  return idx;
}
function fillSelect(sel, opts, val){
  const same = sel.options.length === opts.length && opts.every((o, i) => sel.options[i].value === o[0]);
  if (!same) { sel.textContent = ''; opts.forEach(([v, l]) => sel.appendChild(new Option(l, v))); }
  else opts.forEach(([v, l], i) => { if (sel.options[i].text !== l) sel.options[i].text = l; });
  sel.value = val;
}
function renderFilter(changed){
  for (let pass = 0; pass < 2; pass++) FACETS.forEach(k => {        // drop the other choices that no longer match anything (e.g. a 2B family after switching to 3N); the facet just changed wins
    if (k !== changed && F[k] !== 'all' && !ITEMS.some(it => facetPass(it, k) && it[k] === F[k])) F[k] = 'all';
  });
  FACETS.forEach(k => {
    const cnt = {}; ITEMS.forEach(it => { if (!facetPass(it, k)) return; const c = cnt[it[k]] = cnt[it[k]] || {n: 0, done: 0}; c.n++; if ((mine[it.id] || {}).verdict) c.done++; });
    const keys = Object.keys(cnt).sort(), tot = keys.reduce((a, v) => a + cnt[v].n, 0), dn = keys.reduce((a, v) => a + cnt[v].done, 0);
    fillSelect($('#f-' + k), [['all', `${ANY[k]} (${dn}/${tot})`]].concat(keys.map(v => [v, `${k === 'kind' ? KIND_LABEL[v] || v : v} (${cnt[v].done}/${cnt[v].n})`])), F[k]);
  });
  const sc = {}; STATUS.forEach(([v]) => { sc[v] = 0; });
  ITEMS.forEach(it => { if (!facetPass(it)) return; const r = mine[it.id] || {}; sc.all++; if (!r.verdict) sc.todo++; else sc[r.verdict]++; if (r.unclear) sc.unclear++; });
  fillSelect($('#f-status'), STATUS.map(([v, l]) => [v, `${l} (${sc[v]})`]), F.status);
}
function applyFilter(changed){
  renderFilter(changed);
  try { localStorage.setItem(FKEY, JSON.stringify(F)); } catch (e) {}
  const v = view();
  if (!v.length) { renderChips(); showEmpty(); return; }
  if (v.indexOf(cur) < 0) go(v[0]); else if (emptyView) go(cur); else renderChips();
}
function resetFilter(){ Object.keys(F).forEach(k => { F[k] = 'all'; }); applyFilter(); }
function showEmpty(){
  emptyView = true; const card = $('#card'); card.textContent = '';
  const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'No item matches this filter.';
  const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Show all items'; b.onclick = resetFilter;
  d.append(document.createElement('br'), b); card.appendChild(d);
}
function renderChips(){
  renderFilter();
  const v = view(), p = v.indexOf(cur); if (p >= 0) lastPos = p;
  const box = $('#chips'); box.textContent = '';
  v.forEach(i => {
    const it = ITEMS[i], r = mine[it.id] || {}, b = document.createElement('button');
    b.type = 'button'; b.textContent = it.n; b.title = '#' + it.n + ' · ' + it.family + ' · ' + it.kind + (r.unclear ? ' · marked unclear' : '');
    b.className = [r.verdict || '', r.unclear ? 'uncl' : '', i === cur ? 'cur' : ''].join(' ');
    b.onclick = () => go(i); box.appendChild(b);
  });
  $('#fcount').textContent = v.length + ' of ' + ITEMS.length;
  const done = ITEMS.filter(it => (mine[it.id] || {}).verdict).length;
  $('#pbar').style.width = (100 * done / Math.max(ITEMS.length, 1)) + '%';
  $('#ptxt').textContent = done + ' / ' + ITEMS.length + ' rated';
}
function go(i){ cur = Math.max(0, Math.min(ITEMS.length - 1, i)); stopAt = null; emptyView = false; $('#fmsg').textContent = ''; renderCard(); renderChips(); window.scrollTo({top: 0}); }
function step(d){
  const v = view(), msg = $('#fmsg');
  if (!v.length) { msg.textContent = 'No items left in this filter.'; return; }
  const p = v.indexOf(cur), t = p >= 0 ? p + d : (d > 0 ? lastPos : lastPos - 1);   // the current item may just have left the filter (e.g. "Not rated yet")
  if (t < 0 || t >= v.length) { msg.textContent = d > 0 ? 'That was the last item of this filter.' : 'This is the first item of this filter.'; return; }
  go(v[t]);
}
function verdictChosen(it, v){ if (advance && v) step(1); }

function renderCard(){
  const it = ITEMS[cur], r = mine[it.id] || {}, card = $('#card'); card.textContent = '';
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const meta = h('div', 'meta');
  [`#${it.n}`, it.set, it.concept, it.family, it.kind].forEach(t => meta.appendChild(h('span', 'tag', t)));
  card.appendChild(meta);
  card.appendChild(h('div', 'q', it.question));
  const au = document.createElement('audio'); au.controls = true; au.preload = 'auto'; au.src = it.audio; au.id = 'au'; card.appendChild(au);
  const tw = h('div', 'tlwrap'); const cv = document.createElement('canvas'); cv.id = 'tl'; cv.tabIndex = 0; cv.setAttribute('aria-label', 'Piano roll and timeline: click to seek, click a note to play it'); const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; tw.append(cv, tip); card.appendChild(tw);
  const foot = h('div', 'tlfoot'); const tg = document.createElement('label'); tg.className = 'chk';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'shownotes'; cb.checked = showNotes; cb.onchange = () => { showNotes = cb.checked; try { localStorage.setItem('lc_roll', showNotes ? '1' : '0'); } catch (e) {} draw(); };
  tg.append(cb, document.createTextNode(' Piano roll (notes from the MIDI, with pitch)'));
  foot.append(tg, h('span', '', 'highlighted = the stated answer · ' + it.dur.toFixed(1) + ' s')); card.appendChild(foot);
  card.appendChild(h('div', 'legend', 'One row = one semitone (dark rows = black keys; C rows are labelled) — count the rows between two notes to get the interval. ' + (it.frame ? 'Dashed lines = beats, solid lines = bars of the nominal frame (' + it.frame.meter + ', ' + it.frame.tempo_bpm + ' bpm). ' : '') + 'Hover a note for details, click it to hear it.'));

  const ans = h('div', 'ans'); ans.appendChild(h('div', 'lab', it.kind === 'grounding' ? 'Stated answer (time spans)' : 'Stated answer'));
  if (it.kind === 'understanding') ans.appendChild(h('div', 'txt', it.answer));
  else ans.appendChild(h('div', 'txt', it.spans.length ? it.spans.length + ' span' + (it.spans.length > 1 ? 's' : '') + ' — press to hear each one' : 'No such note in this clip'));
  if (it.spans.length) {
    const sp = h('div', 'spans');
    it.spans.forEach(([a, b], k) => { const bt = h('button', '', '▶ ' + fmt(a) + '–' + fmt(b) + ' s'); bt.onclick = () => playSpan(a, b); sp.appendChild(bt); });
    if (it.kind === 'understanding') ans.appendChild(h('div', 'lab', 'Notes the answer is based on')), ans.appendChild(sp); else ans.appendChild(sp);
  }
  card.appendChild(ans);
  card.appendChild(h('div', 'help', it.kind === 'grounding' ? 'Does the shaded part of the audio contain exactly the notes the question asks for — nothing missing, nothing extra?' : 'Given what you hear (and the context written in the question), is the stated answer correct?'));

  const vs = h('div', 'verdicts');
  [['ok', 'Correct', '1'], ['bad', 'Wrong', '2'], ['unsure', "Can't tell by ear", '3']].forEach(([v, t, k]) => {
    const b = document.createElement('button'); b.dataset.v = v; b.setAttribute('aria-pressed', r.verdict === v ? 'true' : 'false');
    b.append(document.createTextNode(t), Object.assign(document.createElement('kbd'), {textContent: 'key ' + k}));
    b.onclick = () => { const nv = r.verdict === v ? '' : v; save(it, {verdict: nv}); renderCard(); verdictChosen(it, nv); };
    vs.appendChild(b);
  });
  card.appendChild(vs);
  const row = h('div', 'row'); const uc = document.createElement('label'); uc.className = 'chk';
  const ucb = document.createElement('input'); ucb.type = 'checkbox'; ucb.checked = !!r.unclear; ucb.onchange = () => { save(it, {unclear: ucb.checked}); renderChips(); };
  uc.append(ucb, document.createTextNode(' The question itself is unclear or ambiguous (key U)')); row.appendChild(uc); card.appendChild(row);
  const ta = document.createElement('textarea'); ta.placeholder = 'Optional note (what sounded different?)'; ta.value = r.note || ''; ta.id = 'note';
  ta.onchange = () => save(it, {note: ta.value}); card.appendChild(ta);
  const nav = h('div', 'nav'); const pv = h('button', '', '← Previous'), nx = h('button', '', 'Next →'); pv.onclick = () => step(-1); nx.onclick = () => step(1); nav.append(pv, nx); card.appendChild(nav);

  au.addEventListener('play', loop); au.addEventListener('pause', () => { cancelAnimationFrame(raf); draw(); }); au.addEventListener('seeked', draw);
  cv.onclick = e => {
    const hit = noteAt(e);
    if (hit) { playSpan(hit[0], hit[1]); return; }
    const g = geom(it), b = cv.getBoundingClientRect(), x = e.clientX - b.left;
    if (x < g.KW) return;
    au.currentTime = Math.max(0, Math.min(it.dur, (x - g.KW) / (b.width - g.KW - g.RIGHT) * it.dur)); stopAt = null; draw();
  };
  cv.onmousemove = e => {
    const hit = noteAt(e), tip = $('#tip'); cv.style.cursor = hit ? 'pointer' : 'crosshair';
    if (!hit) { tip.hidden = true; return; }
    const i = it.notes.indexOf(hit), prev = i > 0 ? it.notes[i - 1] : null, f = it.set && it.set.indexOf('3N') >= 0;
    tip.textContent = pname(hit[2]) + ' (MIDI ' + hit[2] + ') · ' + fmt(hit[0]) + '–' + fmt(hit[1]) + ' s' + (f ? ' · velocity ' + hit[3] : '') + (prev ? ' · ' + (hit[2] - prev[2] >= 0 ? '+' : '') + (hit[2] - prev[2]) + ' semitones vs previous note' : '');
    const w = cv.parentElement.getBoundingClientRect(), x = e.clientX - w.left, y = e.clientY - w.top;
    tip.hidden = false; tip.style.left = Math.min(x + 12, Math.max(0, w.width - tip.offsetWidth - 6)) + 'px'; tip.style.top = Math.max(0, y - 30) + 'px';
  };
  cv.onmouseleave = () => { $('#tip').hidden = true; };
  requestAnimationFrame(draw);
}
function playSpan(a, b){ const au = $('#au'); au.currentTime = Math.max(0, a - 0.05); stopAt = b + 0.05; au.play(); }
function loop(){ const au = $('#au'); if (!au) return; if (stopAt != null && au.currentTime >= stopAt) { au.pause(); stopAt = null; } draw(); if (!au.paused) raf = requestAnimationFrame(loop); }
const PC_BLACK = [1, 3, 6, 8, 10], NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const pname = p => NOTE_NAMES[p % 12] + (Math.floor(p / 12) - 1);
function geom(it){
  const base = {KW: 0, RIGHT: 0, TOP: 0, BOT: 16, roll: false, H: 110};
  if (!showNotes || !it.notes.length) return base;
  const ps = it.notes.map(n => n[2]); let lo = Math.min(...ps) - 2, hi = Math.max(...ps) + 2;
  if (hi - lo < 12) { const c = Math.round((hi + lo) / 2); lo = c - 6; hi = c + 6; }
  const rows = hi - lo + 1, rh = Math.max(4, Math.min(18, Math.floor(340 / rows))), TOP = it.frame ? 24 : 8, BOT = 18;
  return {KW: 60, RIGHT: 8, TOP, BOT, roll: true, lo, hi, rows, rh, H: TOP + rows * rh + BOT};
}
function noteAt(e){
  const it = ITEMS[cur], cv = $('#tl'), g = geom(it); if (!g.roll) return null;
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top, pw = b.width - g.KW - g.RIGHT;
  for (const n of it.notes) {
    const x0 = g.KW + n[0] / it.dur * pw, x1 = g.KW + n[1] / it.dur * pw, y0 = g.TOP + (g.hi - n[2]) * g.rh;
    if (x >= x0 - 1 && x <= Math.max(x1, x0 + 3) + 1 && y >= y0 && y <= y0 + g.rh) return n;
  }
  return null;
}
function draw(){
  const it = ITEMS[cur], cv = $('#tl'); if (!cv) return; const au = $('#au'), g = geom(it);
  cv.style.height = g.H + 'px';
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hgt = g.H; cv.width = w * dpr; cv.height = hgt * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr); c.clearRect(0, 0, w, hgt);
  const pw = w - g.KW - g.RIGHT, X = t => g.KW + t / it.dur * pw, plotBottom = g.roll ? g.TOP + g.rows * g.rh : hgt - 14;
  const col = n => cssv(n), mono = '11px ' + cssv('--mono');
  c.lineWidth = 1; c.font = mono;
  if (g.roll) {
    for (let p = g.hi; p >= g.lo; p--) {
      const y = g.TOP + (g.hi - p) * g.rh, black = PC_BLACK.indexOf(p % 12) >= 0;
      c.fillStyle = col(black ? '--roll-black' : '--roll-white'); c.fillRect(g.KW, y, pw, g.rh);                 // row
      c.strokeStyle = col(p % 12 === 0 ? '--oct-line' : '--row-line'); c.beginPath(); c.moveTo(g.KW, y + g.rh + .5); c.lineTo(g.KW + pw, y + g.rh + .5); c.stroke();
      c.fillStyle = col(black ? '--key-black' : '--key-white'); c.fillRect(0, y, black ? g.KW * 0.62 : g.KW - 1, g.rh - 1);   // keyboard: black keys shorter
      if (black) { c.fillStyle = col('--key-white'); c.fillRect(g.KW * 0.62, y, g.KW * 0.38 - 1, g.rh - 1); }
      c.strokeStyle = col('--oct-line'); c.beginPath(); c.moveTo(0, y + g.rh - .5); c.lineTo(g.KW, y + g.rh - .5); c.stroke();
    }
    const used = new Set(it.notes.map(n => n[2]));
    for (let p = g.hi; p >= g.lo; p--) {
      const y = g.TOP + (g.hi - p) * g.rh, black = PC_BLACK.indexOf(p % 12) >= 0;
      if (p % 12 === 0 || used.has(p)) {
        c.font = (used.has(p) ? '600 ' : '') + mono; c.fillStyle = used.has(p) ? (black ? col('--key-white') : col('--accent')) : col('--key-ink');
        c.textBaseline = 'middle'; c.fillText(pname(p), black ? 3 : g.KW - 34, y + g.rh / 2); c.textBaseline = 'alphabetic';
      }
    }
    c.font = mono;
  }
  // vertical grid: seconds (bottom labels) and, when the nominal frame is known, beats / bars
  c.strokeStyle = col('--line'); c.fillStyle = col('--muted');
  for (let s = 0; s <= it.dur; s += 1) { c.beginPath(); c.moveTo(X(s) + .5, g.TOP); c.lineTo(X(s) + .5, plotBottom); c.stroke(); c.fillText(s + 's', Math.min(X(s) + 3, w - 24), hgt - 3); }
  if (g.roll && it.frame) {
    const f = it.frame, bpb = f.meter === '6/8' ? 6 : parseInt(f.meter, 10), spb = 60 / f.tempo_bpm;
    for (let k = 0; k <= 2 * bpb; k++) {
      const t = f.music_start + k * spb, x = X(t) + .5, bar = k % bpb === 0;
      if (t > it.dur) break;
      c.setLineDash(bar ? [] : [3, 3]); c.strokeStyle = bar ? col('--ink') : col('--oct-line'); c.lineWidth = bar ? 1.5 : 1;
      c.beginPath(); c.moveTo(x, g.TOP - (bar ? 12 : 4)); c.lineTo(x, plotBottom); c.stroke(); c.setLineDash([]); c.lineWidth = 1;
      c.fillStyle = col('--muted'); c.fillText(bar && k < 2 * bpb ? 'bar ' + (k / bpb + 1) + ' · 1' : (bar ? '' : String(k % bpb + 1)), x + 3, g.TOP - 5);
    }
  }
  const inSpan = n => it.spans.some(([s0, e0]) => n[0] >= s0 - 0.004 && n[1] <= e0 + 0.004);
  c.fillStyle = col('--band'); c.strokeStyle = col('--band-line');
  it.spans.forEach(([a, b]) => { const w0 = Math.max(X(b) - X(a), 2); c.fillRect(X(a), g.TOP, w0, plotBottom - g.TOP); c.strokeRect(X(a) + .5, g.TOP + .5, w0, plotBottom - g.TOP - 1); });
  if (g.roll) {
    const show3n = it.set && it.set.indexOf('3N') >= 0;
    it.notes.forEach(n => {
      const x0 = X(n[0]), x1 = X(n[1]), y = g.TOP + (g.hi - n[2]) * g.rh, wd = Math.max(x1 - x0, 3), hi_ = inSpan(n);
      c.fillStyle = col(hi_ ? '--note-hi' : '--note'); c.fillRect(x0, y + 1, wd, g.rh - 2);
      c.strokeStyle = col('--ink'); c.lineWidth = hi_ ? 1.5 : 0.75; c.strokeRect(x0 + .5, y + 1.5, wd - 1, g.rh - 3); c.lineWidth = 1;
      const label = pname(n[2]) + (show3n ? ' v' + n[3] : '');
      if (g.rh >= 11 && wd >= c.measureText(label).width + 6) { c.fillStyle = col('--note-text'); c.textBaseline = 'middle'; c.fillText(label, x0 + 3, y + g.rh / 2 + .5); c.textBaseline = 'alphabetic'; }
    });
  }
  if (au) { c.strokeStyle = col('--ink'); c.lineWidth = 2; const x = X(au.currentTime || 0); c.beginPath(); c.moveTo(x, g.roll ? g.TOP - 4 : 0); c.lineTo(x, plotBottom); c.stroke(); c.lineWidth = 1; }
}
window.addEventListener('resize', draw);

// ---------------------------------------------------------------- persistence
const queues = {};
function save(it, patch){
  const r = Object.assign({item: it.id, family: it.family, kind: it.kind, uid: uid || 'local', verdict: '', unclear: false, note: ''}, mine[it.id] || {}, patch, {ts: Date.now()});
  mine[it.id] = r; renderChips();
  if (db && uid) {
    const key = uid + '__' + it.id;
    queues[key] = (queues[key] || Promise.resolve()).then(() => db.doc('ratings/' + key).set(r)).catch(e => banner('Could not save to the shared store (' + ((e && e.code) || 'error') + '). Your answer is kept in this browser only.'));
  }
  try { localStorage.setItem('lc_' + it.id, JSON.stringify(r)); } catch (e) {}
  if (tab === 'sum') renderSummary();
}
function banner(t){ const b = $('#banner'); b.hidden = !t; b.textContent = t || ''; }
function loadLocal(){
  ITEMS.forEach(it => { try { const s = localStorage.getItem('lc_' + it.id); if (s) mine[it.id] = JSON.parse(s); } catch (e) {} });
  firstSync = false; applyFilter(); if (!emptyView) renderCard();
}

// ---------------------------------------------------------------- summary
function renderSummary(){
  const v = $('#view-sum'); v.textContent = '';
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const docs = (all.length ? all : Object.values(mine)).filter(d => byId[d.item]);       // ratings of items that were replaced by a newer build stay in the store but are not counted
  const raters = [...new Set(docs.map(d => d.uid))];
  const dec = docs.filter(d => d.verdict === 'ok' || d.verdict === 'bad');
  const pct = (a, b) => b ? (100 * a / b).toFixed(1) + '%' : '–';
  const k = h('div', 'kpis');
  [[docs.filter(d => d.verdict).length, 'ratings in total'], [raters.length, 'raters'],
   [pct(dec.filter(d => d.verdict === 'ok').length, dec.length), 'correct among decided (correct + wrong)'], [pct(docs.filter(d => d.verdict === 'unsure').length, docs.filter(d => d.verdict).length), "can't tell"],
   [docs.filter(d => d.unclear).length, 'marked unclear']].forEach(([n, l]) => { const c = h('div', 'kpi'); c.append(h('b', '', String(n)), h('span', '', l)); k.appendChild(c); });
  v.appendChild(k);
  // agreement among items rated by >= 2 raters
  const per = {}; docs.forEach(d => { if (d.verdict) (per[d.item] = per[d.item] || []).push(d.verdict); });
  const multi = Object.values(per).filter(a => a.length >= 2); const agree = multi.filter(a => a.every(x => x === a[0])).length;
  v.appendChild(h('div', 'help', multi.length ? `Items rated by two or more people: ${multi.length}; identical verdicts on ${agree} (${pct(agree, multi.length)}).` : 'Agreement between raters appears here once an item has two ratings.'));
  const fam = {}; docs.forEach(d => { if (!d.verdict) return; const f = fam[d.family] = fam[d.family] || {n: 0, ok: 0, bad: 0, unsure: 0, unclear: 0}; f.n++; f[d.verdict]++; if (d.unclear) f.unclear++; });
  const tw = h('div', 'tblwrap'), t = document.createElement('table');
  t.innerHTML = '<thead><tr><th>Family</th><th>Ratings</th><th>Correct</th><th>Wrong</th><th>Can\'t tell</th><th>Unclear</th></tr></thead>';
  const tb = document.createElement('tbody');
  Object.keys(fam).sort().forEach(f => { const x = fam[f], tr = document.createElement('tr'); [f, x.n, x.ok, x.bad, x.unsure, x.unclear].forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }); tb.appendChild(tr); });
  t.appendChild(tb); tw.appendChild(t); v.appendChild(tw);
  const fl = docs.filter(d => d.verdict === 'bad' || d.unclear || d.note);
  if (fl.length) {
    v.appendChild(h('h3', '', 'Flagged items'));
    fl.forEach(d => { const it = byId[d.item]; if (!it) return; const row = h('div', 'flag'); const b = h('button', '', '#' + it.n); b.onclick = () => { setTab('rate'); go(ITEMS.indexOf(it)); };
      row.append(b, h('span', '', it.family + ' · ' + (d.verdict ? VERD[d.verdict] : '—') + (d.unclear ? ' · unclear' : '') + (d.note ? ' · ' + d.note : ''))); v.appendChild(row); });
  }
}
function setTab(t){
  tab = t; $('#tab-rate').setAttribute('aria-selected', t === 'rate'); $('#tab-sum').setAttribute('aria-selected', t === 'sum');
  $('#view-rate').hidden = t !== 'rate'; $('#view-sum').hidden = t !== 'sum'; if (t === 'sum') renderSummary(); else requestAnimationFrame(draw);
}
$('#tab-rate').onclick = () => setTab('rate'); $('#tab-sum').onclick = () => setTab('sum');
FACETS.concat('status').forEach(k => { $('#f-' + k).onchange = e => { F[k] = e.target.value; applyFilter(k); }; });
$('#f-reset').onclick = resetFilter;
$('#adv').checked = advance; $('#adv').onchange = e => { advance = e.target.checked; try { localStorage.setItem('lc_adv', advance ? '1' : '0'); } catch (err) {} };
if (window.innerWidth <= 820) $('#fbox').open = false;
document.addEventListener('keydown', e => {
  if (tab !== 'rate' || emptyView || /^(TEXTAREA|INPUT|SELECT)$/.test((e.target.tagName || '')) && e.target.type !== 'checkbox') return;
  const it = ITEMS[cur], r = mine[it.id] || {};
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
  else if (['1', '2', '3'].includes(e.key)) { const v = ['ok', 'bad', 'unsure'][+e.key - 1], nv = r.verdict === v ? '' : v; save(it, {verdict: nv}); renderCard(); verdictChosen(it, nv); }
  else if (e.key === 'u' || e.key === 'U') { save(it, {unclear: !r.unclear}); renderCard(); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); const au = $('#au'); au.paused ? au.play() : au.pause(); }
});

// ---------------------------------------------------------------- start
applyFilter(); if (!emptyView) renderCard();
(async () => {
  try {
    if (typeof claude === 'undefined' || !claude.use) throw 0;
    const user = await claude.use('user'); uid = user ? await user.id() : null;
    db = await claude.use('db');
  } catch (e) {}
  if (!(db && uid)) { banner('Shared saving is not available in this view — your verdicts are stored only in this browser.'); loadLocal(); return; }
  db.collection('ratings').onSnapshot(snap => {
    all = snap.docs.map(d => d.data());
    const m = {}; all.filter(d => d.uid === uid).forEach(d => { m[d.item] = d; });
    Object.keys(m).forEach(k => { if (!mine[k] || (m[k].ts || 0) >= (mine[k].ts || 0)) mine[k] = m[k]; });
    if (firstSync) { firstSync = false; applyFilter(); } else renderChips();
    if (tab === 'sum') renderSummary();
    const it = ITEMS[cur], pressed = (mine[it.id] || {}).verdict || '';
    document.querySelectorAll('.verdicts button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === pressed ? 'true' : 'false'));
  }, e => banner('Live sync stopped (' + ((e && e.code) || 'error') + '). Reload to reconnect.'));
})();
